<html lang="ru">
  <head>

    <title>Проверка взаимодействий</title>
    <style>
      #log {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 99;
        width: 430px;
        margin: 0;
        padding: 10px 12px;
        background: rgba(12, 14, 18, 0.96);
        border: 1px solid #2f353f;
        border-radius: 8px;
        color: #e7eaef;

      #log b {
